<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1877f2">
<title>Shuvo Social PRO</title>
<style>
:root{--blue:#1877f2;--bg:#f0f2f5;--card:#fff;--text:#172033;--muted:#687386;--line:#e4e8ef;--green:#20a56b;--red:#e5484d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Arial,sans-serif;color:var(--text)}button,input,textarea,select{font:inherit}button{border:0;border-radius:9px;padding:10px 13px;background:#e8f0fe;color:#145fc4;font-weight:700;cursor:pointer}button.primary{background:var(--blue);color:white}button.danger{background:#ffebee;color:#c62828}button.ghost{background:transparent;color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;background:#fff;color:var(--text);outline:none}textarea{min-height:75px;resize:vertical}.hidden{display:none!important}.muted{color:var(--muted);font-size:13px}.small{font-size:12px}.top{position:sticky;top:0;z-index:5;background:#fff;box-shadow:0 1px 5px #0001;padding:10px 14px;display:flex;align-items:center;gap:12px}.brand{font-size:21px;font-weight:900;color:var(--blue);white-space:nowrap}.top input{max-width:420px;border-radius:30px;background:#f0f2f5}.top .spacer{flex:1}.wrap{max-width:1100px;margin:15px auto;padding:0 12px;display:grid;grid-template-columns:220px minmax(0,1fr) 230px;gap:14px}.side,.right{position:sticky;top:68px;align-self:start}.navbtn{width:100%;text-align:left;background:transparent;color:#344054;margin:2px 0}.navbtn.active,.navbtn:hover{background:#e5efff;color:var(--blue)}.card{background:var(--card);border-radius:13px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0000000c}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#dbeafe;display:grid;place-items:center;font-weight:800;color:#1764c0;flex:none}.cover{height:155px;border-radius:12px;background:linear-gradient(120deg,#1877f2,#80b7ff);background-size:cover;background-position:center}.profile-head{margin-top:-38px;padding-left:15px;display:flex;align-items:end;gap:12px}.profile-head .avatar{width:88px;height:88px;border:4px solid white;font-size:24px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1}.posttext{white-space:pre-wrap;line-height:1.5;margin:12px 0}.postimg{width:100%;max-height:520px;object-fit:contain;border-radius:9px;background:#f5f6f8}.storyrail{display:flex;gap:9px;overflow:auto}.story{min-width:88px;height:125px;border-radius:12px;background:linear-gradient(145deg,#1877f2,#a8d2ff);color:white;display:flex;align-items:end;padding:8px;font-weight:700;background-size:cover;background-position:center}.story span{background:#0006;border-radius:6px;padding:3px}.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.item{background:#f7f9fc;border:1px solid var(--line);padding:10px;border-radius:10px}.comment{background:#f0f2f5;border-radius:12px;padding:8px 10px;margin:7px 0}.auth{max-width:420px;margin:8vh auto;padding:18px}.auth h1{color:var(--blue)}.section-title{font-weight:800;margin:4px 0 10px}.modal{position:fixed;inset:0;background:#0008;z-index:20;display:grid;place-items:center;padding:15px}.modalbox{background:white;border-radius:14px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:17px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#182230;color:white;padding:11px 16px;border-radius:9px;z-index:50}.badge{background:#e8f0fe;color:#145fc4;border-radius:20px;padding:3px 8px;font-size:11px}.feedhead{display:flex;align-items:center;gap:10px}.feedhead .meta{flex:1}.line{height:1px;background:var(--line);margin:10px 0}.empty{text-align:center;padding:25px;color:var(--muted)}@media(max-width:850px){.wrap{grid-template-columns:1fr}.side,.right{position:static}.side{display:flex;overflow:auto;gap:4px}.navbtn{width:auto;white-space:nowrap}.right{display:none}}@media(max-width:520px){.top{gap:7px;padding:8px}.brand{font-size:17px}.top input{max-width:none;min-width:0}.wrap{margin:8px auto;padding:0 8px}.card{padding:12px}.grid3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="authView" class="auth card">
<h1>Shuvo Social PRO</h1><p class="muted">আপনার বন্ধুদের সঙ্গে যুক্ত থাকুন</p>
<div class="tabs"><button id="loginTab" class="primary" onclick="setAuthMode('login')">লগইন</button><button id="regTab" onclick="setAuthMode('register')">নতুন অ্যাকাউন্ট</button></div>
<div id="authFields"></div><p class="muted small">আগের Firebase প্রজেক্ট ব্যবহার হচ্ছে। আপনার আগের অ্যাকাউন্ট মুছে যাবে না।</p>
</div>
<div id="appView" class="hidden">
<header class="top"><div class="brand" onclick="go('home')">Shuvo Social</div><input id="globalSearch" placeholder="মানুষ, পোস্ট, গ্রুপ খুঁজুন..." onkeydown="if(event.key==='Enter')searchAll(this.value)"><button onclick="go('notifications')">🔔<span id="notifCount"></span></button><button onclick="go('messages')">💬</button><div class="spacer"></div><button class="ghost" onclick="logout()">লগআউট</button></header>
<div class="wrap">
<aside class="side">
<button class="navbtn active" data-page="home" onclick="go('home')">🏠 হোম</button>
<button class="navbtn" data-page="profile" onclick="go('profile')">👤 প্রোফাইল</button>
<button class="navbtn" data-page="friends" onclick="go('friends')">👥 বন্ধু</button>
<button class="navbtn" data-page="messages" onclick="go('messages')">💬 মেসেঞ্জার</button>
<button class="navbtn" data-page="notifications" onclick="go('notifications')">🔔 নোটিফিকেশন</button>
<button class="navbtn" data-page="stories" onclick="go('stories')">⭕ স্টোরি</button>
<button class="navbtn" data-page="reels" onclick="go('reels')">🎬 রিলস</button>
<button class="navbtn" data-page="groups" onclick="go('groups')">👨‍👩‍👧 গ্রুপ</button>
<button class="navbtn" data-page="pages" onclick="go('pages')">📄 পেজ</button>
<button class="navbtn" data-page="settings" onclick="go('settings')">⚙️ সেটিংস</button>
</aside>
<main id="main"></main>
<aside class="right"><div class="card"><div class="section-title">Shuvo Social PRO</div><p class="muted">আপনার কমিউনিটি, বন্ধু এবং পোস্ট এক জায়গায়।</p><div class="line"></div><div class="muted">সুরক্ষা টিপস</div><p class="small">পাসওয়ার্ড কাউকে দেবেন না। জন্মদিনের গোপনীয়তা সেটিংস ঠিক রাখুন।</p></div><div class="card"><div class="section-title">দ্রুত লিংক</div><button class="navbtn" onclick="go('friends')">বন্ধু খুঁজুন</button><button class="navbtn" onclick="go('groups')">গ্রুপ তৈরি করুন</button></div></aside>
</div></div>
<div id="modal" class="modal hidden" onclick="if(event.target.id==='modal')closeModal()"><div class="modalbox" id="modalbox"></div></div><div id="toast" class="toast hidden"></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js';
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut,updateProfile}from'https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js';
import{getFirestore,collection,doc,setDoc,getDoc,addDoc,updateDoc,deleteDoc,query,where,orderBy,onSnapshot,getDocs,serverTimestamp,arrayUnion,arrayRemove,limit}from'https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js';
const firebaseConfig={apiKey:"AIzaSyA3XuygLSiDvjo938TO-PEGiCX3g_jfhhM",authDomain:"shuvo-social-pro.firebaseapp.com",projectId:"shuvo-social-pro",storageBucket:"shuvo-social-pro.firebasestorage.app",messagingSenderId:"1057718200307",appId:"1:1057718200307:web:780fe59035c35a1d8d5486",measurementId:"G-BH4JVSKS85"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let me=null,myData={},authMode='login',page='home',unsubs=[],feed=[],users=[],friends=[],friendships=[],requests=[],activeChat=null,chatUnsub=null,searchTerm='';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}
function avatar(u,size=''){let src=u?.photoURL||u?.photo||'';return `<img class="avatar ${size}" src="${esc(src)}" onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<div class=avatar>${esc((u?.name||u?.displayName||'?').slice(0,1))}</div>')">`}
function showAuth(){ $('loginTab').className=authMode==='login'?'primary':'';$('regTab').className=authMode==='register'?'primary':'';$('authFields').innerHTML=authMode==='login'?`<input id="email" placeholder="ইমেইল"><br><br><input id="pass" type="password" placeholder="পাসওয়ার্ড"><br><br><button class="primary" style="width:100%" onclick="doAuth()">লগইন</button>`:`<input id="name" placeholder="আপনার নাম"><br><br><input id="email" placeholder="ইমেইল"><br><br><input id="pass" type="password" placeholder="কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড"><br><br><button class="primary" style="width:100%" onclick="doAuth()">অ্যাকাউন্ট তৈরি</button>`}
window.showAuth=showAuth;
window.setAuthMode=(mode)=>{authMode=mode;showAuth()};
showAuth();
window.doAuth=async()=>{try{let email=$('email').value.trim(),pass=$('pass').value;if(authMode==='login')await signInWithEmailAndPassword(auth,email,pass);else{let name=$('name').value.trim();if(!name)throw Error('নাম লিখুন');let c=await createUserWithEmailAndPassword(auth,email,pass);await updateProfile(c.user,{displayName:name});await setDoc(doc(db,'users',c.user.uid),{uid:c.user.uid,name,email,bio:'',birthday:'',birthdayPrivacy:'friends',photoURL:'',coverURL:'',createdAt:serverTimestamp(),friends:[]})}}catch(e){toast(e.message)}};
window.logout=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{unsubs.forEach(f=>f());unsubs=[];if(chatUnsub){chatUnsub();chatUnsub=null}if(!user){me=null;friendships=[];$('authView').classList.remove('hidden');$('appView').classList.add('hidden');return}try{me=user;$('authView').classList.add('hidden');$('appView').classList.remove('hidden');let r=await getDoc(doc(db,'users',me.uid));if(!r.exists())await setDoc(doc(db,'users',me.uid),{uid:me.uid,name:me.displayName||me.email.split('@')[0],email:me.email,bio:'',birthday:'',birthdayPrivacy:'friends',photoURL:'',coverURL:'',friends:[]});await loadMine();startListeners();go('home')}catch(e){toast('অ্যাকাউন্ট লোড হয়নি: '+e.message)}});
async function loadMine(){let s=await getDoc(doc(db,'users',me.uid));myData=s.data()||{}}
function friendIds(){return [...new Set([...(myData.friends||[]),...friendships.map(f=>(f.participants||[]).find(x=>x!==me.uid)).filter(Boolean)])]}
function startListeners(){unsubs.push(onSnapshot(query(collection(db,'calls'),where('to','==',me.uid)),s=>{s.docChanges().forEach(ch=>{if(ch.type==='added'){let c=ch.doc.data();if(c.status!=='ringing')return;if(confirm((c.fromName||'একজন বন্ধু')+' আপনাকে '+(c.type==='video'?'ভিডিও':'অডিও')+' কল করছেন। রিসিভ করবেন?'))acceptCall(ch.doc.id);else updateDoc(doc(db,'calls',ch.doc.id),{status:'rejected'}).catch(()=>{});}})}));unsubs.push(onSnapshot(query(collection(db,'posts'),orderBy('createdAt','desc'),limit(80)),s=>{feed=s.docs.map(d=>({id:d.id,...d.data()}));if(page==='home'||page==='profile')render()}));unsubs.push(onSnapshot(collection(db,'users'),s=>{users=s.docs.map(d=>({uid:d.id,...d.data()}));if(page==='friends'||page==='home'||page==='notifications')render()}));unsubs.push(onSnapshot(query(collection(db,'friendRequests'),where('to','==',me.uid)),s=>{requests=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.status==='pending');if(page==='friends'||page==='notifications')render()}));unsubs.push(onSnapshot(query(collection(db,'friendships'),where('participants','array-contains',me.uid)),s=>{friendships=s.docs.map(d=>({id:d.id,...d.data()}));if(page==='friends'||page==='profile'||page==='notifications')render()}));}
window.go=p=>{page=p;document.querySelectorAll('.navbtn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()};
function userBy(id){return users.find(u=>u.uid===id)||{uid:id,name:'ব্যবহারকারী'}}
function isFriend(id){return friendIds().includes(id)||(myData.friends||[]).includes(id)}
function canSeeBirthday(u){return u.uid===me.uid||u.birthdayPrivacy==='everyone'||(u.birthdayPrivacy==='friends'&&isFriend(u.uid))}
function postCard(p){let u=userBy(p.uid),liked=(p.likes||[]).includes(me.uid),comments=p.comments||[];return `<article class="card"><div class="feedhead">${avatar(u)}<div class="meta"><b onclick="viewProfile('${p.uid}')">${esc(u.name||'ব্যবহারকারী')}</b><div class="muted">${p.createdAt?.toDate?p.createdAt.toDate().toLocaleString('bn-BD'):'এখনই'} ${p.scope==='friends'?'· বন্ধু':'· পাবলিক'}</div></div>${p.uid===me.uid?`<button class="ghost" onclick="deletePost('${p.id}')">🗑</button>`:''}</div><div class="posttext">${esc(p.text||'')}</div>${p.media?`<img class="postimg" src="${esc(p.media)}">`:''}<div class="muted">${(p.likes||[]).length}টি প্রতিক্রিয়া · ${comments.length}টি মন্তব্য</div><div class="line"></div><div class="actions"><button onclick="react('${p.id}','Like')">${liked?'👍':'♡'} লাইক</button><button onclick="commentPrompt('${p.id}')">💬 মন্তব্য</button><button onclick="sharePost('${p.id}')">↗ শেয়ার</button><button onclick="react('${p.id}','Love')">❤️</button></div>${comments.slice(-3).map(c=>`<div class="comment"><b>${esc(c.name||'ব্যবহারকারী')}</b> ${esc(c.text)}</div>`).join('')}</article>`}
function composer(){return `<div class="card"><div class="row">${avatar(myData)}<input id="postText" placeholder="আপনার মনে কী চলছে?"></div><div class="grid2" style="margin-top:9px"><input id="postMedia" placeholder="ছবির URL (ঐচ্ছিক)"><select id="postScope"><option value="public">পাবলিক</option><option value="friends">শুধু বন্ধু</option></select></div><div class="actions"><button class="primary" onclick="createPost()">পোস্ট করুন</button><button onclick="go('stories')">স্টোরি</button><button onclick="go('reels')">রিলস</button></div></div>`}
function renderHome(){return `<div class="card"><div class="section-title">স্টোরি</div><div class="storyrail"><div class="story" onclick="go('stories')"><span>＋ আপনার স্টোরি</span></div>${feed.filter(p=>p.kind==='story').slice(0,8).map(p=>`<div class="story" style="background-image:url('${esc(p.media||'')}')" onclick="viewStory('${p.id}')"><span>${esc(userBy(p.uid).name)}</span></div>`).join('')}</div></div>${composer()}${feed.filter(p=>!p.kind||p.kind==='post').map(postCard).join('')||'<div class="card empty">এখনও কোনো পোস্ট নেই। প্রথম পোস্টটি আপনিই করুন!</div>'}`}
function profileMarkup(u,own=false){let birthday=canSeeBirthday(u)?(u.birthday||'উল্লেখ করা হয়নি'):'গোপন রাখা হয়েছে';return `<div class="card"><div class="cover" style="background-image:url('${esc(u.coverURL||'')}')"></div><div class="profile-head">${avatar(u)}<div><h2 style="margin:0">${esc(u.name||'ব্যবহারকারী')}</h2><div class="muted">${(u.uid===me.uid?friendIds().length:(u.friends||[]).length)} বন্ধু</div></div></div><div class="actions">${own?'<button class="primary" onclick="editProfile()">প্রোফাইল সম্পাদনা</button>':`<button class="primary" onclick="sendRequest('${u.uid}')">বন্ধু অনুরোধ</button><button onclick="openChat('${u.uid}')">মেসেজ</button>`}</div><div class="line"></div><p><b>পরিচিতি</b><br>${esc(u.bio||'কোনো বায়ো দেওয়া হয়নি')}</p><p>🎂 জন্মদিন: ${esc(birthday)}</p><p class="muted">ইমেইল: ${own?esc(u.email||me.email):'গোপন'}</p></div>${feed.filter(p=>p.uid===u.uid&&(!p.kind||p.kind==='post')).map(postCard).join('')}`}
function render(){if(!me)return;let u=users.find(x=>x.uid===me.uid)||myData;if(page==='home')$('main').innerHTML=renderHome();else if(page==='profile')$('main').innerHTML=profileMarkup(u,true);else if(page==='friends')renderFriends();else if(page==='notifications')renderNotifications();else if(page==='messages')renderMessages();else if(page==='stories')renderStories();else if(page==='reels')renderReels();else if(page==='groups')renderGroups();else if(page==='pages')renderPages();else if(page==='settings')renderSettings()}
function renderFriends(){let incoming=requests;let list=users.filter(u=>u.uid!==me.uid);$('main').innerHTML=`<div class="card"><h3>বন্ধু অনুরোধ</h3>${incoming.map(r=>`<div class="row between item">${esc(userBy(r.from).name)}<div><button class="primary" onclick="acceptRequest('${r.id}','${r.from}')">গ্রহণ</button><button class="danger" onclick="rejectRequest('${r.id}')">বাদ</button></div></div>`).join('')||'<p class="muted">নতুন অনুরোধ নেই</p>'}</div><div class="card"><h3>আপনার বন্ধু (${friendIds().length})</h3>${friendIds().map(id=>{let x=userBy(id);return `<div class="row between item">${avatar(x)}<b onclick="viewProfile('${id}')">${esc(x.name)}</b><button onclick="openChat('${id}')">মেসেজ</button></div>`}).join('')||'<p class="muted">এখনও বন্ধু নেই</p>'}</div><div class="card"><h3>মানুষ খুঁজুন</h3><input id="peopleSearch" placeholder="নাম লিখুন" oninput="filterPeople(this.value)"><div id="peopleResults">${list.slice(0,20).map(x=>personRow(x)).join('')}</div></div>`}
function personRow(x){return `<div class="row between item" style="margin-top:7px">${avatar(x)}<b onclick="viewProfile('${x.uid}')">${esc(x.name||'নাম নেই')}</b><button onclick="sendRequest('${x.uid}')">বন্ধু হন</button></div>`}
window.filterPeople=v=>{$('peopleResults').innerHTML=users.filter(x=>x.uid!==me.uid&&(x.name||'').toLowerCase().includes(v.toLowerCase())).slice(0,30).map(personRow).join('')};
function renderNotifications(){$('main').innerHTML=`<div class="card"><h3>নোটিফিকেশন</h3>${requests.map(r=>`<div class="item">👥 ${esc(userBy(r.from).name)} আপনাকে বন্ধু অনুরোধ পাঠিয়েছেন। <button onclick="go('friends')">দেখুন</button></div>`).join('')||'<div class="empty">এখন কোনো নোটিফিকেশন নেই</div>'}</div><div class="card"><h3>জন্মদিন</h3>${users.filter(x=>x.uid!==me.uid&&canSeeBirthday(x)&&x.birthday&&new Date(x.birthday).getMonth()===new Date().getMonth()&&new Date(x.birthday).getDate()===new Date().getDate()).map(x=>`🎂 আজ ${esc(x.name)}-এর জন্মদিন!`).join('<br>')||'<p class="muted">আজ পরিচিত কারও জন্মদিন নেই।</p>'}</div>`}
function renderMessages(){$('main').innerHTML=`<div class="card"><h3>মেসেঞ্জার</h3><input id="chatSearch" placeholder="বন্ধুর নাম খুঁজুন" oninput="chatPeople(this.value)"><div id="chatPeople">${users.filter(x=>x.uid!==me.uid).slice(0,30).map(x=>`<div class="row between item" style="margin-top:7px">${avatar(x)}<b>${esc(x.name)}</b><button onclick="openChat('${x.uid}')">চ্যাট খুলুন</button></div>`).join('')}</div></div><div id="chatBox"></div>`}
window.chatPeople=v=>{$('chatPeople').innerHTML=users.filter(x=>x.uid!==me.uid&&(x.name||'').toLowerCase().includes(v.toLowerCase())).map(x=>`<div class="row between item">${avatar(x)}<b>${esc(x.name)}</b><button onclick="openChat('${x.uid}')">চ্যাট</button></div>`).join('')};
window.openChat=async uid=>{activeChat=uid;page='messages';render();let ids=[me.uid,uid].sort(),chatId=ids.join('_');await setDoc(doc(db,'chats',chatId),{participants:ids,updatedAt:serverTimestamp()},{merge:true});if(chatUnsub)chatUnsub();$('chatBox').innerHTML=`<div class="card"><div class="row between"><h3>${esc(userBy(uid).name)}</h3><div><button onclick="startCall('audio','${uid}')">📞 অডিও</button><button onclick="startCall('video','${uid}')">📹 ভিডিও</button></div></div><div id="callStatus" class="muted"></div><div id="remoteVideoWrap" class="hidden"><video id="remoteVideo" autoplay playsinline style="width:100%;max-height:300px;background:#111;border-radius:10px"></video><video id="localVideo" autoplay muted playsinline style="width:100px;position:relative;margin-top:-80px"></video><button class="danger" onclick="endCall()">কল কেটে দিন</button></div><div id="chatMessages" style="max-height:300px;overflow:auto"></div><div class="row"><input id="messageText" placeholder="মেসেজ লিখুন" onkeydown="if(event.key==='Enter')sendMessage('${chatId}','${uid}')"><button class="primary" onclick="sendMessage('${chatId}','${uid}')">পাঠান</button></div></div>`;chatUnsub=onSnapshot(query(collection(db,'chats',chatId,'messages'),orderBy('createdAt','asc'),limit(100)),s=>{$('chatMessages').innerHTML=s.docs.map(d=>{let m=d.data();return `<div class="comment" style="text-align:${m.from===me.uid?'right':'left'}">${esc(m.text)}</div>`}).join('');$('chatMessages').scrollTop=99999})};

function renderStories(){$('main').innerHTML=`<div class="card"><h3>স্টোরি তৈরি করুন</h3><input id="storyText" placeholder="স্টোরির লেখা"><input id="storyMedia" placeholder="ছবি/ভিডিও URL" style="margin-top:8px"><button class="primary" style="margin-top:8px" onclick="createKind('story')">স্টোরি প্রকাশ</button></div><div class="card"><h3>সাম্প্রতিক স্টোরি</h3>${feed.filter(p=>p.kind==='story').map(p=>`<div class="item" onclick="viewStory('${p.id}')">${esc(userBy(p.uid).name)} · ${esc(p.text||'স্টোরি')} <span class="muted">· ২৪ ঘণ্টার মধ্যে মুছে ফেলুন</span></div>`).join('')||'<p class="muted">স্টোরি নেই</p>'}</div>`}
function renderReels(){$('main').innerHTML=`<div class="card"><h3>রিলস / ছোট ভিডিও</h3><input id="reelText" placeholder="ভিডিওর ক্যাপশন"><input id="reelMedia" placeholder="ভিডিওর সরাসরি URL (mp4)" style="margin-top:8px"><button class="primary" style="margin-top:8px" onclick="createKind('reel')">রিল প্রকাশ</button></div>${feed.filter(p=>p.kind==='reel').map(p=>`<div class="card"><b>${esc(userBy(p.uid).name)}</b><p>${esc(p.text)}</p><video controls style="width:100%;max-height:480px" src="${esc(p.media)}"></video><button onclick="react('${p.id}','Like')">👍 ${p.likes?.length||0}</button></div>`).join('')||'<div class="card empty">এখনও রিল নেই</div>'}`}
function renderGroups(){$('main').innerHTML=`<div class="card"><h3>গ্রুপ তৈরি করুন</h3><input id="groupName" placeholder="গ্রুপের নাম"><textarea id="groupAbout" placeholder="গ্রুপ সম্পর্কে"></textarea><button class="primary" onclick="createCommunity('groups')">গ্রুপ তৈরি</button></div><div class="card"><h3>গ্রুপসমূহ</h3><div id="groupList">লোড হচ্ছে...</div></div>`;loadCommunities('groups')}
function renderPages(){$('main').innerHTML=`<div class="card"><h3>পেজ তৈরি করুন</h3><input id="pageName" placeholder="পেজের নাম"><textarea id="pageAbout" placeholder="পেজ সম্পর্কে"></textarea><button class="primary" onclick="createCommunity('pages')">পেজ তৈরি</button></div><div class="card"><h3>পেজসমূহ</h3><div id="pageList">লোড হচ্ছে...</div></div>`;loadCommunities('pages')}
async function loadCommunities(type){try{let s=await getDocs(query(collection(db,type),limit(50)));let el=$(type==='groups'?'groupList':'pageList');el.innerHTML=s.docs.map(d=>{let x=d.data();return `<div class="item" style="margin:7px 0"><b>${esc(x.name)}</b><p>${esc(x.about||'')}</p><button onclick="joinCommunity('${type}','${d.id}')">যোগ দিন</button></div>`}).join('')||'এখনও কিছু তৈরি হয়নি'}catch(e){toast(e.message)}}
window.createCommunity=async type=>{let name=$(type==='groups'?'groupName':'pageName').value.trim(),about=$(type==='groups'?'groupAbout':'pageAbout').value;if(!name)return toast('নাম লিখুন');await addDoc(collection(db,type),{name,about,owner:me.uid,members:[me.uid],createdAt:serverTimestamp()});toast('তৈরি হয়েছে');render()};
window.joinCommunity=async(type,id)=>{await updateDoc(doc(db,type,id),{members:arrayUnion(me.uid)});toast('যোগ দেওয়া হয়েছে')};
function renderSettings(){$('main').innerHTML=`<div class="card"><h3>সেটিংস</h3><p class="muted">অ্যাকাউন্টের প্রোফাইল তথ্য ও গোপনীয়তা পরিবর্তন করুন।</p><button class="primary" onclick="editProfile()">প্রোফাইল সম্পাদনা</button></div><div class="card"><h3>নিরাপত্তা ও গোপনীয়তা</h3><p>জন্মদিনের গোপনীয়তা নিয়ন্ত্রণ আপনার প্রোফাইল সম্পাদনায় রয়েছে।</p><p class="muted small">এই অ্যাপের Firestore Rules সঠিকভাবে সেট করা জরুরি।</p></div>`}
window.createPost=async()=>{let text=$('postText').value.trim(),media=$('postMedia').value.trim();if(!text&&!media)return toast('লেখা বা ছবির URL দিন');await addDoc(collection(db,'posts'),{uid:me.uid,text,media,scope:$('postScope').value,kind:'post',likes:[],comments:[],createdAt:serverTimestamp()});toast('পোস্ট প্রকাশ হয়েছে')};
window.createKind=async kind=>{let text=$(kind==='story'?'storyText':'reelText').value.trim(),media=$(kind==='story'?'storyMedia':'reelMedia').value.trim();if(!text&&!media)return toast('কিছু লিখুন বা URL দিন');await addDoc(collection(db,'posts'),{uid:me.uid,text,media,scope:'public',kind,likes:[],comments:[],createdAt:serverTimestamp()});toast('প্রকাশ হয়েছে');go(kind==='story'?'stories':'reels')};
window.react=async(id,type)=>{let r=doc(db,'posts',id),s=await getDoc(r);if(!s.exists())return;let p=s.data(),likes=p.likes||[];await updateDoc(r,{likes:likes.includes(me.uid)?arrayRemove(me.uid):arrayUnion(me.uid),lastReaction:type});};
window.commentPrompt=async id=>{let text=prompt('আপনার মন্তব্য লিখুন');if(!text?.trim())return;await updateDoc(doc(db,'posts',id),{comments:arrayUnion({uid:me.uid,name:myData.name||me.displayName,text:text.trim(),at:Date.now()})})};
window.sharePost=async id=>{let url=location.href.split('#')[0]+'#post-'+id;try{await navigator.clipboard.writeText(url);toast('পোস্টের লিংক কপি হয়েছে')}catch{prompt('লিংক কপি করুন',url)}};
window.deletePost=async id=>{if(confirm('পোস্টটি মুছবেন?'))await deleteDoc(doc(db,'posts',id))};
window.sendRequest=async uid=>{if(uid===me.uid)return;let q=query(collection(db,'friendRequests'),where('from','==',me.uid),where('to','==',uid));let s=await getDocs(q);if(s.empty){await addDoc(collection(db,'friendRequests'),{from:me.uid,to:uid,status:'pending',createdAt:serverTimestamp()});toast('অনুরোধ পাঠানো হয়েছে')}else toast('আগেই অনুরোধ পাঠিয়েছেন')};
window.acceptRequest=async(id,from)=>{try{let ids=[me.uid,from].sort(),requestRef=doc(db,'friendRequests',id);await updateDoc(requestRef,{status:'accepted',respondedAt:serverTimestamp()});await setDoc(doc(db,'friendships',ids.join('_')),{participants:ids,requestId:id,createdAt:serverTimestamp()});toast('বন্ধু যুক্ত হয়েছে')}catch(e){toast('অনুরোধ গ্রহণ হয়নি: '+e.message)}};
window.rejectRequest=async id=>{try{await updateDoc(doc(db,'friendRequests',id),{status:'rejected',respondedAt:serverTimestamp()});toast('অনুরোধ বাদ দেওয়া হয়েছে')}catch(e){toast(e.message)}};
window.viewProfile=async uid=>{let u=users.find(x=>x.uid===uid);if(!u){let s=await getDoc(doc(db,'users',uid));u={uid,...s.data()}}$('modalbox').innerHTML=profileMarkup(u,uid===me.uid);$('modal').classList.remove('hidden')};
window.closeModal=()=>$('modal').classList.add('hidden');
window.editProfile=()=>{$('modalbox').innerHTML=`<h3>প্রোফাইল সম্পাদনা</h3><input id="editName" value="${esc(myData.name||'')}" placeholder="নাম"><textarea id="editBio" placeholder="বায়ো">${esc(myData.bio||'')}</textarea><label>জন্মদিন</label><input id="editBirthday" type="date" value="${esc(myData.birthday||'')}"><label>জন্মদিন কে দেখতে পাবে?</label><select id="editPrivacy"><option value="everyone">সবাই</option><option value="friends">শুধু বন্ধুরা</option><option value="onlyme">শুধু আমি</option></select><input id="editPhoto" placeholder="প্রোফাইল ছবির URL" value="${esc(myData.photoURL||'')}"><input id="editCover" placeholder="কভার ছবির URL" value="${esc(myData.coverURL||'')}"><button class="primary" style="margin-top:10px" onclick="saveProfile()">সেভ করুন</button><button onclick="closeModal()">বন্ধ</button>`;$('editPrivacy').value=myData.birthdayPrivacy||'friends';$('modal').classList.remove('hidden')};
window.saveProfile=async()=>{let data={name:$('editName').value.trim(),bio:$('editBio').value.trim(),birthday:$('editBirthday').value,birthdayPrivacy:$('editPrivacy').value,photoURL:$('editPhoto').value.trim(),coverURL:$('editCover').value.trim()};await updateDoc(doc(db,'users',me.uid),data);await updateProfile(me,{displayName:data.name,photoURL:data.photoURL||null});await loadMine();closeModal();render();toast('প্রোফাইল আপডেট হয়েছে')};
window.viewStory=id=>{let p=feed.find(x=>x.id===id);if(!p)return;$('modalbox').innerHTML=`<h3>${esc(userBy(p.uid).name)}-এর স্টোরি</h3><p>${esc(p.text||'')}</p>${p.media?`<img class="postimg" src="${esc(p.media)}">`:''}<button onclick="closeModal()">বন্ধ</button>`;$('modal').classList.remove('hidden')};

let pc=null,localStream=null,currentCallId=null,callRole=null,callDocUnsub=null,candidateUnsubs=[];
const rtcConfig={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
async function setupPeer(callId,role,remoteUid){
  pc=new RTCPeerConnection(rtcConfig);
  pc.onicecandidate=e=>{if(e.candidate){let side=role==='caller'?'callerCandidates':'calleeCandidates';addDoc(collection(db,'calls',callId,side),e.candidate.toJSON()).catch(err=>toast('নেটওয়ার্ক সিগন্যাল পাঠানো যায়নি: '+err.message))}};
  pc.ontrack=e=>{let v=$('remoteVideo');if(v){v.srcObject=e.streams[0];$('remoteVideoWrap').classList.remove('hidden')}};
  pc.onconnectionstatechange=()=>{if(pc&&['failed','disconnected','closed'].includes(pc.connectionState)&&pc.connectionState==='failed')toast('কল সংযোগ হয়নি। TURN server লাগতে পারে।')};
  localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:role==='caller'&&window._callType==='video'||role==='callee'&&window._incomingType==='video'});
  localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  if($('localVideo'))$('localVideo').srcObject=localStream;
  let remoteSide=role==='caller'?'calleeCandidates':'callerCandidates';
  let unsub=onSnapshot(collection(db,'calls',callId,remoteSide),s=>s.docChanges().forEach(ch=>{if(ch.type==='added'&&pc){pc.addIceCandidate(new RTCIceCandidate(ch.doc.data())).catch(()=>{})}}));
  candidateUnsubs.push(unsub);
}
window.startCall=async(type,uid)=>{
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw Error('HTTPS ওয়েবসাইটে খুলুন এবং ক্যামেরা/মাইক্রোফোন অনুমতি দিন');
  if(pc)cleanupCall(true);
  window._callType=type;currentCallId=doc(collection(db,'calls')).id;callRole='caller';
  $('callStatus').textContent='কল করা হচ্ছে...';
  const ref=doc(db,'calls',currentCallId);
  await setDoc(ref,{from:me.uid,fromName:myData.name||me.displayName||'বন্ধু',to:uid,type,status:'ringing',createdAt:serverTimestamp()});
  await setupPeer(currentCallId,'caller',uid);
  let offer=await pc.createOffer();await pc.setLocalDescription(offer);
  await updateDoc(ref,{offer:{type:offer.type,sdp:offer.sdp}});
  callDocUnsub=onSnapshot(ref,async s=>{let d=s.data();if(!d)return;if(d.answer&&pc&&pc.signalingState==='have-local-offer')await pc.setRemoteDescription(new RTCSessionDescription(d.answer));if(['rejected','ended'].includes(d.status)){toast(d.status==='rejected'?'কল গ্রহণ করা হয়নি':'কল শেষ হয়েছে');cleanupCall(false)}});
 }catch(e){toast('কল শুরু হয়নি: '+e.message);cleanupCall(false)}
};
window.acceptCall=async callId=>{
 try{
  let ref=doc(db,'calls',callId),s=await getDoc(ref);if(!s.exists())return;
  let data=s.data();window._incomingType=data.type;currentCallId=callId;callRole='callee';
  await setupPeer(callId,'callee',data.from);
  await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
  let answer=await pc.createAnswer();await pc.setLocalDescription(answer);
  await updateDoc(ref,{answer:{type:answer.type,sdp:answer.sdp},status:'answered'});
  callDocUnsub=onSnapshot(ref,x=>{let d=x.data();if(d&&d.status==='ended')cleanupCall(false)});
  if($('callStatus'))$('callStatus').textContent='কলে যুক্ত হয়েছেন';
 }catch(e){toast('কল রিসিভ হয়নি: '+e.message);cleanupCall(false)}
};
function cleanupCall(updateRemote=true){
 if(updateRemote&&currentCallId)updateDoc(doc(db,'calls',currentCallId),{status:'ended'}).catch(()=>{});
 if(callDocUnsub){callDocUnsub();callDocUnsub=null}candidateUnsubs.forEach(f=>f());candidateUnsubs=[];
 if(pc){pc.close();pc=null}if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}
 let wrap=$('remoteVideoWrap');if(wrap)wrap.classList.add('hidden');
 let status=$('callStatus');if(status)status.textContent='';currentCallId=null;callRole=null;
}
window.endCall=()=>{cleanupCall(true);toast('কল শেষ হয়েছে')};

window.searchAll=v=>{searchTerm=v;go('friends');$('peopleSearch').value=v;filterPeople(v)};
</script>
